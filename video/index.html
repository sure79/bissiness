<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>하루안부 사용 장면</title>
<style>
@font-face{font-family:NKL;src:url(fonts/la-400.woff2);font-weight:400}
@font-face{font-family:NKL;src:url(fonts/la-500.woff2);font-weight:500}
@font-face{font-family:NKL;src:url(fonts/la-700.woff2);font-weight:700}
@font-face{font-family:NKL;src:url(fonts/la-900.woff2);font-weight:900}
@font-face{font-family:NK;src:url(fonts/kr-400.woff2);font-weight:400}
@font-face{font-family:NK;src:url(fonts/kr-500.woff2);font-weight:500}
@font-face{font-family:NK;src:url(fonts/kr-700.woff2);font-weight:700}
@font-face{font-family:NK;src:url(fonts/kr-900.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;width:1920px;height:1080px;overflow:hidden}
body{font-family:NKL,NK,sans-serif;color:#1D2633;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FFF5EA}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;overflow:hidden}
.abs{position:absolute}
.full{left:0;top:0;width:100%;height:100%}
.ctr{text-align:center;left:0;width:1920px}
#capwrap{position:absolute;left:0;right:0;bottom:64px;display:flex;justify-content:center;z-index:100;pointer-events:none}
#cap{background:rgba(22,30,46,.86);color:#fff;font-size:42px;font-weight:700;padding:20px 46px;border-radius:999px;white-space:nowrap;opacity:0;letter-spacing:-.5px}
.pill{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:10px 24px;font-size:26px;font-weight:700;box-shadow:0 8px 24px rgba(20,30,50,.12);white-space:nowrap}
.panel{position:absolute;border-radius:36px;overflow:hidden;box-shadow:0 30px 60px rgba(60,40,20,.12)}
/* phone */
.phone{position:absolute;width:400px;height:820px;background:#15181D;border-radius:62px;padding:14px;box-shadow:0 40px 80px rgba(30,40,60,.28),inset 0 0 0 3px #2C313A}
.screen{position:relative;width:100%;height:100%;background:#F3F6F4;border-radius:50px;overflow:hidden}
.screen::before{content:'';position:absolute;left:50%;top:12px;width:116px;height:34px;margin-left:-58px;background:#15181D;border-radius:20px;z-index:30}
.sbar{position:absolute;top:0;left:0;right:0;height:58px;padding:18px 36px 0;display:flex;justify-content:space-between;font-size:19px;font-weight:700;z-index:29}
.scr{position:absolute;left:0;right:0;top:58px;bottom:0;padding:14px 22px}
.apphead{display:flex;align-items:center;gap:12px;font-size:27px;font-weight:900;margin-bottom:16px}
.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.06);margin-bottom:16px}
.btn{background:#22B07D;color:#fff;border-radius:20px;padding:20px;text-align:center;font-size:23px;font-weight:700}
.btn.gray{background:#E7ECEA;color:#46525F}
.btn.red{background:#E5484D}
.noti{position:absolute;left:12px;right:12px;top:60px;background:rgba(255,255,255,.98);border-radius:26px;padding:16px 18px;display:flex;gap:14px;box-shadow:0 14px 34px rgba(0,0,0,.2);z-index:28;opacity:0}
.noti .na{font-size:15px;color:#7A8591;font-weight:500}
.noti .nt{font-size:20px;font-weight:900;margin-top:2px;line-height:1.3}
.noti .nb{font-size:17px;color:#46525F;margin-top:3px;line-height:1.35}
.light{width:36px;height:36px;border-radius:50%;background:#C9D1D6;flex:none}
.stats{display:flex;gap:12px;margin-top:18px}
.stats>div{flex:1;background:#F3F6F4;border-radius:16px;padding:12px 14px}
.stats>div>span{display:block;font-size:15px;color:#7A8591;font-weight:500}
.stats b{font-size:28px;font-weight:900}
.stt{margin-top:14px;font-size:19px;font-weight:700;color:#22B07D}
.dbar{position:relative;height:46px;background:#EEF2F0;border-radius:12px;overflow:hidden}
.tick{position:absolute;top:8px;width:9px;height:30px;border-radius:5px;background:#22B07D;opacity:0}
.dlab{display:flex;justify-content:space-between;font-size:14px;color:#8A949E;margin-top:8px;font-weight:500}
.tap{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(30,40,50,.22);border:4px solid rgba(255,255,255,.95);opacity:0;z-index:40}
.lbl{position:absolute;left:0;right:0;top:-74px;display:flex;justify-content:center}
.scrn{position:absolute;left:0;right:0;top:0;bottom:0;opacity:0}
.door{transform-origin:0 50%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:14px;color:#8A949E;font-weight:700;padding-bottom:6px}
.cal .d{height:62px;border-radius:12px;font-size:16px;font-weight:700;padding-top:6px;position:relative}
.cal .d i{position:absolute;left:50%;top:34px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#22B07D;opacity:0}
.stat{position:absolute;width:460px;background:#fff;border-radius:30px;padding:30px 36px;box-shadow:0 20px 40px rgba(20,60,40,.1);opacity:0}
.stat span{font-size:24px;color:#6B7684;font-weight:700;display:block}
.stat b{font-size:64px;font-weight:900;color:#1D2633;letter-spacing:-1px}
.stat small{font-size:24px;color:#22B07D;font-weight:700;margin-left:8px}
.tog{width:76px;height:44px;border-radius:22px;background:#D5DCD9;position:relative;flex:none}
.tog i{position:absolute;left:4px;top:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
</style></head>
<body><div id="stage"><div id="capwrap"><div id="cap"></div></div></div>
<script>
/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),in:x=>x*x*x,io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const P=(t,a,b,e=E.io)=>e(clamp((t-a)/(b-a)));
const L=(t,a,b,v0,v1,e=E.io)=>v0+(v1-v0)*P(t,a,b,e);
const fio=(t,a,b,d=.4)=>Math.min(P(t,a,a+d,E.lin),1-P(t,b-d,b,E.lin));
function tf(el,{x=0,y=0,s=1,r=0,o}={}){if(!el)return;el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;if(o!==undefined)el.style.opacity=o}
const op=(el,o)=>{if(el)el.style.opacity=o};
function key(t,ks){if(t<=ks[0][0])return ks[0][1];for(let i=1;i<ks.length;i++){if(t<=ks[i][0]){const[a,va]=ks[i-1],[b,vb]=ks[i];return va+(vb-va)*(t-a)/(b-a)}}return ks[ks.length-1][1]}
const hm=(h,m)=>h*60+m;
const hhmm=m=>{m=Math.floor(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function lerpC(a,b,p){const A=a.match(/\w\w/g).map(h=>parseInt(h,16)),B=b.match(/\w\w/g).map(h=>parseInt(h,16));return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(',')+')'}
const SKY=[[300,'27345E'],[370,'FFBE8F'],[450,'A9DCFF'],[1020,'A9DCFF'],[1110,'FF9C74'],[1190,'2C3A69'],[1440,'1D2648']];
function sky(m){for(let i=1;i<SKY.length;i++){if(m<=SKY[i][0]){return lerpC(SKY[i-1][1],SKY[i][1],clamp((m-SKY[i-1][0])/(SKY[i][0]-SKY[i-1][0])))}}return'rgb(29,38,72)'}
function bez(p0,c,p1,u){const a=(1-u)*(1-u),b=2*(1-u)*u,d=u*u;return[a*p0[0]+b*c[0]+d*p1[0],a*p0[1]+b*c[1]+d*p1[1]]}
function tap(el,t,t0){if(!el)return;const p=clamp((t-t0)/0.6);const on=t>=t0-0.25&&t<t0+0.6;tf(el,{s:t<t0?L(t,t0-.25,t0,1.3,1):1+p*.5,o:on?(t<t0?P(t,t0-.25,t0):1-p):0})}

/* ---------- art ---------- */
const MOM={hair:'#C3C5CB',skin:'#F3C9A6',top:'#9B6FB5',bottom:'#5B4A6B',style:'bun',glasses:true};
const DAU={hair:'#2B211C',skin:'#F5CDAA',top:'#4F7FD9',bottom:'#2F3B57',style:'pony'};
const NEI={hair:'#6B4630',skin:'#EDC09A',top:'#F08A4B',bottom:'#4B5563',style:'curly'};
function person(o,w=200,vb='0 0 200 420',extra=''){
 const{hair,skin,top,bottom,style,glasses,bag,hat}=o;let back='',front='';
 if(style==='pony'){back=`<ellipse cx="148" cy="96" rx="20" ry="36" fill="${hair}" transform="rotate(-22 148 96)"/>`;front=`<path d="M50 106 Q44 44 100 44 Q158 44 150 106 Q146 76 120 64 Q94 86 54 96 Z" fill="${hair}"/>`}
 if(style==='bun'){back=`<circle cx="100" cy="44" r="24" fill="${hair}"/>`;front=`<path d="M50 104 Q48 50 100 50 Q152 50 150 104 Q142 72 100 68 Q58 72 50 104Z" fill="${hair}"/>`}
 if(style==='curly'){front=[[58,84],[70,62],[92,50],[116,52],[136,64],[148,86],[52,104],[150,106]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="20" fill="${hair}"/>`).join('')}
 const g=glasses?`<g fill="none" stroke="#6A5A52" stroke-width="3"><circle cx="82" cy="106" r="13"/><circle cx="118" cy="106" r="13"/><path d="M95 106h10"/></g>`:'';
 const bg=bag?`<rect x="38" y="168" width="124" height="128" rx="26" fill="#7C5B3E"/><rect x="62" y="150" width="14" height="40" rx="7" fill="#5E432C"/><rect x="124" y="150" width="14" height="40" rx="7" fill="#5E432C"/>`:'';
 const ht=hat?`<path d="M46 78 Q100 18 154 78 Z" fill="#E9A23B"/><rect x="30" y="72" width="140" height="13" rx="6" fill="#CF8722"/>`:'';
 return`<svg viewBox="${vb}" width="${w}" height="${w*(+vb.split(' ')[3])/(+vb.split(' ')[2])}" style="overflow:visible;display:block">${bg}${back}
 <rect x="72" y="292" width="25" height="108" rx="12" fill="${bottom}"/><rect x="103" y="292" width="25" height="108" rx="12" fill="${bottom}"/>
 <ellipse cx="82" cy="402" rx="21" ry="9" fill="#3A3A3A"/><ellipse cx="120" cy="402" rx="21" ry="9" fill="#3A3A3A"/>
 <g class="armL"><rect x="32" y="172" width="26" height="118" rx="13" fill="${top}" transform="rotate(10 45 180)"/><circle cx="34" cy="290" r="14" fill="${skin}"/></g>
 <g class="armR"><rect x="142" y="172" width="26" height="118" rx="13" fill="${top}" transform="rotate(-10 155 180)"/><circle cx="166" cy="290" r="14" fill="${skin}"/></g>
 <path d="M56 172 Q100 150 144 172 L152 300 Q100 314 48 300 Z" fill="${top}"/>
 <rect x="89" y="134" width="22" height="30" rx="6" fill="${skin}"/>
 <circle cx="100" cy="100" r="48" fill="${skin}"/>${front}
 <g class="eyes"><ellipse cx="82" cy="108" rx="5" ry="6" fill="#2A2320"/><ellipse cx="118" cy="108" rx="5" ry="6" fill="#2A2320"/></g>
 <circle cx="70" cy="124" r="7" fill="#F49A8A" opacity=".55"/><circle cx="130" cy="124" r="7" fill="#F49A8A" opacity=".55"/>
 <path d="M88 126 Q100 136 112 126" fill="none" stroke="#7A3B2E" stroke-width="4" stroke-linecap="round"/>${g}${ht}${extra}</svg>`}
const face=(o,s)=>`<div style="width:${s}px;height:${s}px;border-radius:50%;overflow:hidden;background:#FFE9D2;flex:none">${person(o,s,'40 30 120 120')}</div>`;
const logo=s=>`<svg viewBox="0 0 120 120" width="${s}" height="${s}" style="display:block;flex:none"><rect width="120" height="120" rx="30" fill="#22B07D"/><path d="M26 58 L60 30 L94 58 V92 Q94 97 89 97 H31 Q26 97 26 92Z" fill="#fff"/><rect x="50" y="62" width="20" height="35" rx="4" fill="#22B07D"/><circle cx="65" cy="80" r="2.8" fill="#fff"/><circle cx="94" cy="30" r="10" fill="#FFD166"/></svg>`;
const sbarIcons=`<span style="display:flex;gap:6px;align-items:center"><svg width="26" height="16"><rect x="0" y="10" width="4" height="6" rx="1" fill="#1D2633"/><rect x="7" y="7" width="4" height="9" rx="1" fill="#1D2633"/><rect x="14" y="4" width="4" height="12" rx="1" fill="#1D2633"/><rect x="21" y="0" width="4" height="16" rx="1" fill="#1D2633"/></svg><svg width="30" height="16"><rect x=".5" y=".5" width="25" height="15" rx="4" fill="none" stroke="#1D2633"/><rect x="3" y="3" width="18" height="10" rx="2" fill="#1D2633"/><rect x="27" y="5" width="2" height="6" rx="1" fill="#1D2633"/></svg></span>`;
const phone=(cls,inner,time='10:24',style='')=>`<div class="phone ${cls}" style="${style}"><div class="screen"><div class="sbar"><span class="ptime">${time}</span>${sbarIcons}</div>${inner}<div class="tap"></div></div></div>`;
const noti=(t,b,cls='')=>`<div class="noti ${cls}">${logo(46)}<div><div class="na">하루안부 · 지금</div><div class="nt">${t}</div><div class="nb">${b}</div></div></div>`;
const homeCard=(sub='전주 · 화장실 문 센서')=>`<div class="card"><div style="display:flex;align-items:center;gap:16px">${face(MOM,70)}<div style="flex:1"><div style="font-size:26px;font-weight:900">어머니</div><div style="font-size:16px;color:#7A8591;font-weight:500">${sub}</div></div><div class="light"></div></div>
 <div class="stats"><div><span>마지막 신호</span><b class="last">--:--</b></div><div><span>오늘 신호</span><b><span class="cnt">0</span>회</b></div></div><div class="stt">아직 신호가 없어요</div></div>`;
const dayCard=n=>`<div class="card"><div style="font-size:18px;font-weight:700;margin-bottom:14px">오늘의 신호</div><div class="dbar">${Array.from({length:n},()=>'<div class="tick"></div>').join('')}</div><div class="dlab"><span>06시</span><span>12시</span><span>18시</span><span>24시</span></div></div>`;
const phoneIcon=c=>`<svg viewBox="0 0 24 24" width="56" height="56"><path fill="${c}" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>`;
const camIcon=c=>`<svg viewBox="0 0 24 24" width="56" height="56"><path fill="${c}" d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 3a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>`;
const check=(s,c='#22B07D')=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}" style="display:block"><circle cx="50" cy="50" r="48" fill="${c}"/><path d="M28 52 L44 67 L73 36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- house (shared by day & alert scenes) ---------- */
function house(){return`<div class="panel house" style="left:60px;top:130px;width:1100px;height:790px;background:#FBE7CF">
 <div class="abs hwin" style="left:90px;top:90px;width:280px;height:210px;border:14px solid #fff;border-radius:18px;background:#A9DCFF;overflow:hidden">
  <div class="abs sun" style="left:150px;top:30px;width:60px;height:60px;border-radius:50%;background:#FFD166"></div>
  <div class="abs" style="left:0;top:118px;width:260px;height:70px;background:#7FBF8E;border-radius:50% 50% 0 0"></div>
  <div class="abs flash full" style="opacity:0"></div>
  <div class="abs" style="left:119px;top:0;width:14px;height:190px;background:#fff"></div><div class="abs" style="left:0;top:84px;width:260px;height:14px;background:#fff"></div></div>
 <div class="abs" style="left:450px;top:110px;width:160px;height:120px;border:10px solid #fff;border-radius:10px;background:#F7D9B5;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.08)">
  <div class="abs" style="left:10px;top:20px">${face(MOM,58)}</div><div class="abs" style="left:68px;top:26px">${face(DAU,58)}</div></div>
 <div class="abs" style="left:0;top:610px;width:1100px;height:180px;background:#E2BE93"></div>
 <div class="abs" style="left:0;top:606px;width:1100px;height:10px;background:#CFA678"></div>
 <div class="abs" style="left:90px;top:450px;width:400px;height:170px;border-radius:44px;background:#6F8FC4"></div>
 <div class="abs momSit" style="left:218px;top:360px">${person(MOM,144)}</div>
 <div class="abs" style="left:80px;top:560px;width:420px;height:120px;border-radius:30px;background:#5F80B8"></div>
 <div class="abs" style="left:58px;top:500px;width:72px;height:180px;border-radius:30px;background:#56739F"></div>
 <div class="abs" style="left:450px;top:500px;width:72px;height:180px;border-radius:30px;background:#56739F"></div>
 <div class="abs" style="left:100px;top:678px;width:16px;height:24px;background:#3E4F6E;border-radius:4px"></div><div class="abs" style="left:464px;top:678px;width:16px;height:24px;background:#3E4F6E;border-radius:4px"></div>
 <div class="abs" style="left:550px;top:540px;width:120px;height:14px;background:#A9774B;border-radius:6px"></div><div class="abs" style="left:602px;top:554px;width:16px;height:60px;background:#8C6545"></div>
 <div class="abs mph" style="left:586px;top:494px;width:46px;height:48px"><div class="abs mphg" style="left:-20px;top:-20px;width:86px;height:86px;border-radius:50%;background:radial-gradient(#FFE08A,rgba(255,224,138,0) 70%);opacity:0"></div><div class="abs" style="left:4px;top:0;width:38px;height:48px;background:#1D2633;border-radius:8px"><div class="abs mphs" style="left:4px;top:4px;width:30px;height:40px;background:#3B4656;border-radius:5px"></div></div></div>
 <div class="abs" style="left:720px;top:190px;width:270px;height:420px;background:#8C6545;border-radius:12px 12px 0 0">
  <div class="abs" style="left:14px;top:14px;width:242px;height:406px;background:#2F3440"></div>
  <div class="abs door" style="left:14px;top:14px;width:242px;height:406px;background:#D59B63;border-radius:4px">
   <div class="abs" style="left:24px;top:110px;width:194px;height:120px;border:4px solid #C3884F;border-radius:8px"></div>
   <div class="abs" style="left:24px;top:250px;width:194px;height:130px;border:4px solid #C3884F;border-radius:8px"></div>
   <div class="abs" style="left:56px;top:34px;width:130px;height:54px;background:#fff;border-radius:12px;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#3B4656">화장실</div>
   <div class="abs" style="left:202px;top:214px;width:24px;height:24px;border-radius:50%;background:#F2D27A"></div>
   <div class="abs" style="left:226px;top:150px;width:14px;height:40px;border-radius:4px;background:#E9EEF2"></div></div></div>
 <div class="abs" style="left:978px;top:330px;width:26px;height:64px;background:#fff;border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.18)"><div class="abs led" style="left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#B9C3C9"></div></div>
 <div class="abs momWalk" style="left:230px;top:300px;opacity:0">${person(MOM,150)}</div>
 <div class="abs neigh" style="left:-200px;top:300px;opacity:0">${person(NEI,150)}</div>
 <div class="abs dizzy" style="left:236px;top:318px;opacity:0"><svg width="110" height="50" viewBox="0 0 110 50"><path d="M5 30 q10 -25 20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#7A5BB0" stroke-width="5" stroke-linecap="round"/></svg></div>
 <div class="abs b119" style="left:470px;top:240px;opacity:0"><div class="pill" style="background:#E5484D;color:#fff;font-size:30px">${phoneIcon('#fff').replace(/56/g,'34')} 119 연락</div></div>
 <div class="abs hpill" style="left:0;width:1100px;top:28px;display:flex;justify-content:center;opacity:0"><div class="pill" style="background:#E5484D;color:#fff;font-size:28px">마지막 신호 07:10 · <b class="nosig">8시간째 신호 없음</b></div></div>
